<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft Dashboard</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #14161a; color: #e6e6e6; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: #1c1f26; border-bottom: 1px solid #2a2e38; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #dot { width: 12px; height: 12px; border-radius: 50%; background: #666; }
  #dot.on { background: #46c46a; } #dot.off { background: #d04545; }
  main { max-width: 920px; margin: 0 auto; padding: 20px; display: grid; gap: 20px; }
  section { background: #1c1f26; border: 1px solid #2a2e38; border-radius: 10px; padding: 16px; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #9aa0ab; margin: 0 0 12px; }
  button { background: #2f3340; color: #e6e6e6; border: 1px solid #3a3f4d; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 13px; }
  button:hover { background: #3a3f4d; } button:disabled { opacity: .5; cursor: default; }
  button.primary { background: #2f6fd0; border-color: #2f6fd0; } button.primary:hover { background: #3a7ee0; }
  button.danger { background: #b03a3a; border-color: #b03a3a; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select { background: #14161a; color: #e6e6e6; border: 1px solid #3a3f4d; border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  #console { background: #0c0d10; border: 1px solid #2a2e38; border-radius: 6px; height: 320px; overflow-y: auto; padding: 10px; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; line-height: 1.4; }
  #console .l { color: #cfd3da; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid #2a2e38; }
  .cfg-grid { display: grid; grid-template-columns: 180px 1fr auto; gap: 8px 12px; align-items: center; }
  .muted { color: #9aa0ab; font-size: 12px; }
  #toast { position: fixed; bottom: 16px; right: 16px; background: #2f3340; border: 1px solid #3a3f4d; border-radius: 8px; padding: 10px 14px; font-size: 13px; opacity: 0; transition: opacity .2s; max-width: 360px; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <span id="dot"></span>
  <h1>Minecraft Dashboard</h1>
  <span id="state" class="muted"></span>
  <span style="flex:1"></span>
  <button class="primary" data-power="start">起動</button>
  <button data-power="restart">再起動</button>
  <button class="danger" data-power="stop">停止</button>
</header>

<main>
  <section>
    <h2>コンソール</h2>
    <div id="console"></div>
    <div class="row" style="margin-top:10px">
      <input id="cmd" placeholder="コマンド (例: list, say hello) — Enter で送信" style="flex:1">
      <button id="send">送信</button>
    </div>
  </section>

  <section>
    <h2>ゲームプレイ設定</h2>
    <div id="cfg" class="cfg-grid"></div>
    <p id="cfg-note" class="muted" style="margin:10px 0 0"></p>
  </section>

  <section>
    <h2>Whitelist</h2>
    <div class="row" style="margin-bottom:10px">
      <input id="wl-name" placeholder="プレイヤー名 / ゲーマータグ">
      <label class="muted"><input type="checkbox" id="wl-bedrock"> Bedrock</label>
      <button id="wl-add">追加</button>
    </div>
    <table><tbody id="wl-list"></tbody></table>
  </section>

  <section>
    <h2>バックアップ</h2>
    <div class="row" style="margin-bottom:10px">
      <button id="bk-run" class="primary">今すぐバックアップ</button>
      <span class="muted">world のみ・整合スナップショット・世代保持</span>
    </div>
    <table><tbody id="bk-list"></tbody></table>
  </section>
</main>

<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
